# 临时诊断 workflow —— 用来判断 Actions 为什么被立即取消
#
# 假设 A：只有 macOS runner 起不来（账号/额度问题）
#   → 这个 ubuntu 任务应该能正常跑
# 假设 B：整个 Actions 对这个账号被拦（邮箱未验证 / 新账号风控）
#   → 这个 ubuntu 任务也会被立即 cancelled
#
# 跑完就删掉这个文件。

name: CI Diagnose

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/ci-diagnose.yml'

jobs:
  ubuntu-probe:
    name: ubuntu probe
    runs-on: ubuntu-latest
    steps:
      - name: echo
        run: |
          echo "=== runner info ==="
          uname -a
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "ubuntu probe OK"

  macos-probe:
    name: macos probe
    runs-on: macos-14
    steps:
      - name: echo
        run: |
          echo "=== runner info ==="
          sw_vers
          uname -m
          echo "RUNNER_OS=$RUNNER_OS"
          echo "macos probe OK"
