# 临时诊断：探测哪些 macOS 标签能分配到 runner
# ubuntu 已验证可用，所以不是账号级封锁。
# 这里同时试 4 个 macOS 标签，看是不是某个特定版本不可用。

name: CI Diagnose macOS

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/ci-macos-probe.yml'

jobs:
  macos13:
    name: probe macos-13
    runs-on: macos-13
    steps:
      - name: echo
        run: |
          sw_vers
          uname -m
          echo "OK macos-13"

  macos14:
    name: probe macos-14
    runs-on: macos-14
    steps:
      - name: echo
        run: |
          sw_vers
          uname -m
          echo "OK macos-14"

  macos15:
    name: probe macos-15
    runs-on: macos-15
    steps:
      - name: echo
        run: |
          sw_vers
          uname -m
          echo "OK macos-15"

  macoslatest:
    name: probe macos-latest
    runs-on: macos-latest
    steps:
      - name: echo
        run: |
          sw_vers
          uname -m
          echo "OK macos-latest"
